name: testler
on:
  push:
    branches: [feature/football-intelligence-v1]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Kurulum (bağımlılıklar + sabit OpenFootball verisi)
        run: bash deploy/kur.sh
      - name: Testler
        run: python3 -m unittest discover -s tests
